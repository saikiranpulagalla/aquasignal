[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasignal-oneaquahealth"
version = "0.6.1"
description = "Verified freshwater risk communication for OneAquaHealth Track 6 Resilience Informatics"
requires-python = "==3.13.5"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.48,<1",
  "pydantic>=2.13,<3",
  "httpx>=0.28,<1",
  "defusedxml>=0.7,<1",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]
adaption = ["adaption>=0"]

[tool.setuptools.packages.find]
include = ["aquasignal*", "signallock*", "apps*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
aquasignal = [
  "resources/requirements.lock",
  "resources/web_aqua/*",
  "resources/data/aqua/*",
  "resources/data/results/*",
]
